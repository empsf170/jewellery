<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Aura Luxury</title>
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💎</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <section class="section-padding" style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background-color: var(--bg-light);">
        <div class="container" style="max-width: 500px; width: 100%; background: var(--white); padding: 40px; border-radius: 8px; box-shadow: 0 5px 15px rgba(0,0,0,0.05);">
            <div class="logo" style="text-align: center; margin-bottom: 20px;">
                <a href="index.html">AURA <span>LUXURY</span></a>
            </div>
            <div class="section-title" style="margin-bottom: 30px;">
                <h2>Login</h2>
            </div>
            <form style="display: flex; flex-direction: column; gap: 20px;">
                <input type="email" placeholder="Email Address" required style="padding: 15px; border: 1px solid #ddd; border-radius: 4px;">
                <div style="position: relative; width: 100%;">
                    <input type="password" placeholder="Password" required style="padding: 15px; border: 1px solid #ddd; border-radius: 4px; width: 100%; box-sizing: border-box; padding-right: 40px;">
                    <i class="fas fa-eye toggle-password" style="position: absolute; right: 15px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #666;"></i>
                </div>
                <div style="display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem;">
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; color: #666;" class="auth-hover-text">
                        <input type="checkbox"> Remember me
                    </label>
                    <a href="#" style="color: var(--secondary-color);" class="auth-hover">Forgot Password?</a>
                </div>
                <button type="submit" class="btn btn-primary" style="padding: 15px; width: 100%; border-radius: 4px;">Sign In</button>
            </form>
            <p style="text-align: center; margin-top: 20px; color: #666;">Don't have an account? <a href="signup.html" style="color: var(--secondary-color); font-weight: bold;" class="auth-hover">Sign Up</a></p>
        </div>
    </section>
    <script src="script.js"></script>
</body>
</html>
